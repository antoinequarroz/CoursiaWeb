<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Coursia</title>
  <desc id="desc">Visuel social Coursia avec fond vert profond et accent corail.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f2d27"/>
      <stop offset="1" stop-color="#2a4c44"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#ff7a59"/>
      <stop offset="1" stop-color="#ffcfa8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="965" cy="120" r="210" fill="#a6c1b1" opacity=".18"/>
  <circle cx="210" cy="520" r="180" fill="#ffcfa8" opacity=".16"/>
  <rect x="92" y="86" width="1016" height="458" rx="48" fill="#fff5e8" opacity=".95"/>
  <text x="146" y="190" fill="#0f2d27" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="8">COURSIA</text>
  <text x="146" y="300" fill="#0f2d27" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="900">Votre copilote</text>
  <text x="146" y="386" fill="url(#accent)" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="900">de la recette à la table.</text>
  <text x="148" y="462" fill="#5f6f67" font-family="Inter, Arial, sans-serif" font-size="30">Repas, courses, budget et foyer dans une app.</text>
</svg>

